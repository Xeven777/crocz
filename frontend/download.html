<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Crocz - Download</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body
    class="bg-[var(--color-dark)] min-h-screen flex flex-col items-center pt-16 pb-10 text-[var(--color-lightest)] relative">
    <div class="box -bottom-44 -left-10 z-20 fixed scale-75 hidden md:block">
        <div class="belly"></div>
        <div class="back"></div>
        <div class="hump">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="back-leg">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="front-leg"></div>
        <div class="eye">
            <div class="eye-ball"></div>
        </div>
        <div class="nose">
            <div class="nostril"></div>
        </div>

        <div class="tooth-1"></div>
        <div class="tooth-2"></div>
        <div class="tooth-3"></div>
    </div>

    <div class="relative z-10 w-full max-w-6xl px-6">
        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="bagel text-3xl md:text-6xl text-[var(--color-lightest)]">
                CROCZ
            </h1>
            <p class="text-[var(--color-medium)] text-base md:text-lg font-light mt-2">
                Download your secure file
            </p>
        </div>

        <!-- Main Download Interface -->
        <div class="rounded-3xl p-8 neubox max-w-md mx-auto">
            <div class="text-center mb-6">
                <div class="upload-icon text-[var(--color-light)] mb-4 flex justify-center">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 rotate-180 translate-y-4">
                        <path d="M7 14L12 9L17 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M12 20V9" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        <path d="M20 20H4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </div>
                <h2 class="text-xl font-semibold text-[var(--color-light)] mb-2 tracking-tight">
                    Retrieve Your File
                </h2>
                <p class="text-[var(--color-medium)] text-sm text-center">
                    Enter your share code and passphrase to download
                </p>
            </div>

            <form id="downloadForm" class="space-y-6">
                <div>
                    <label class="block text-lg mb-3 text-[var(--color-light)] bagel tracking-wider">Share Code</label>
                    <input title="Enter Share Code" type="text" name="code" id="codeInput" required
                        class="input-field w-full px-4 py-3 rounded-xl text-[var(--color-lightest)] placeholder-[var(--color-medium)] focus:outline-none font-medium"
                        placeholder="Enter your share code" />
                </div>
                <div>
                    <label class="block text-lg mb-3 text-[var(--color-light)] bagel tracking-wider">Passphrase</label>
                    <input title="Enter Passphrase" type="text" name="passphrase" required
                        class="input-field w-full px-4 py-3 rounded-xl text-[var(--color-lightest)] placeholder-[var(--color-medium)] focus:outline-none font-medium"
                        placeholder="Enter security passphrase" />
                </div>
                <button type="submit"
                    class="btn-primary w-full py-4 px-6 rounded-xl text-[var(--color-dark)] font-black text-lg transition-all duration-300">
                    🔓 Download File
                </button>
            </form>

            <div class="result mt-8 text-center" id="result"></div>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const presetCode = urlParams.get("code");
        if (presetCode) {
            document.getElementById("codeInput").value = presetCode;
        }
        const form = document.getElementById("downloadForm");
        const resultDiv = document.getElementById("result");
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const code = form.code.value.trim();
            const passphrase = form.passphrase.value.trim();
            const downloadUrl = `/download/${code}?passphrase=${encodeURIComponent(passphrase)}`;
            try {
                resultDiv.innerHTML = "<div class='bg-[var(--color-light)]/10 border border-[var(--color-light)]/40 rounded-2xl p-6 shadow-lg'><span class='text-[var(--color-light)] font-bold'>⏬ Downloading...</span></div>";
                const res = await fetch(downloadUrl);
                if (!res.ok) {
                    const err = await res.text();
                    resultDiv.innerHTML = `<div class='bg-red-500/10 border border-red-500/40 rounded-2xl p-6 shadow-lg'><span class='text-red-400 font-bold'>❌ ${err}</span></div>`;
                    return;
                }
                const blob = await res.blob();
                const contentDisposition = res.headers.get("Content-Disposition");
                const filename = contentDisposition?.split("filename=")[1]?.replaceAll('"', '') || "file";
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                link.click();
                resultDiv.innerHTML = "<div class='bg-[var(--color-light)]/10 border border-[var(--color-light)]/40 rounded-2xl p-6 shadow-lg'><span class='text-[var(--color-light)] font-bold'>✅ Download complete.</span></div>";
            } catch (err) {
                resultDiv.innerHTML = "<div class='bg-red-500/10 border border-red-500/40 rounded-2xl p-6 shadow-lg'><span class='text-red-400 font-bold'>❌ Failed to download file.</span></div>";
            }
        });
    </script>
</body>

</html>
