<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Crocz - Download</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body
    class="bg-gradient-to-br from-slate-900 via-emerald-900 to-slate-800 min-h-screen flex flex-col items-center justify-center text-slate-100">
    <h1 class="text-4xl font-extrabold mb-8 tracking-tight text-emerald-400 drop-shadow-lg">Download Your File <span
            class="inline-block animate-bounce">🔓</span></h1>
    <div class="bg-slate-800/80 backdrop-blur-lg shadow-2xl rounded-2xl p-8 w-full max-w-md flex flex-col items-center">
        <form id="downloadForm" class="w-full flex flex-col gap-6">
            <div>
                <label class="block text-lg font-semibold mb-2 text-emerald-300">Enter Share Code</label>
                <input title="Enter Share Code" type="text" name="code" id="codeInput" required
                    class="bg-slate-700/60 text-slate-100 rounded-lg w-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-400" />
            </div>
            <div>
                <label class="block text-lg font-semibold mb-2 text-emerald-300">Enter Passphrase</label>
                <input title="Enter Passphrase" type="text" name="passphrase" required
                    class="bg-slate-700/60 text-slate-100 rounded-lg w-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-400" />
            </div>
            <button type="submit"
                class="bg-gradient-to-r from-emerald-400 to-emerald-600 text-slate-900 font-bold py-3 rounded-xl shadow-lg hover:scale-105 hover:from-emerald-500 hover:to-emerald-700 transition-all duration-200">Download
                File</button>
        </form>
        <div class="result mt-6 text-center text-base font-medium" id="result"></div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const presetCode = urlParams.get("code");
        if (presetCode) {
            document.getElementById("codeInput").value = presetCode;
        }
        const form = document.getElementById("downloadForm");
        const resultDiv = document.getElementById("result");
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const code = form.code.value.trim();
            const passphrase = form.passphrase.value.trim();
            const downloadUrl = `/download/${code}?passphrase=${encodeURIComponent(passphrase)}`;
            try {
                resultDiv.innerHTML = "<span class='text-emerald-400 font-bold'>⏬ Downloading...</span>";
                const res = await fetch(downloadUrl);
                if (!res.ok) {
                    const err = await res.text();
                    resultDiv.innerHTML = `<span class='text-red-400 font-bold'>❌ ${err}</span>`;
                    return;
                }
                const blob = await res.blob();
                const contentDisposition = res.headers.get("Content-Disposition");
                const filename = contentDisposition?.split("filename=")[1]?.replaceAll('"', '') || "file";
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                link.click();
                resultDiv.innerHTML = "<span class='text-emerald-400 font-bold'>✅ Download complete.</span>";
            } catch (err) {
                resultDiv.innerHTML = "<span class='text-red-400 font-bold'>❌ Failed to download file.</span>";
            }
        });
    </script>
</body>

</html>
