<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Crocz - Upload</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body
    class="bg-gradient-to-br from-slate-900 via-emerald-900 to-slate-800 min-h-screen flex flex-col items-center justify-center text-slate-100">
    <h1 class="text-4xl font-extrabold mb-8 tracking-tight text-emerald-400 drop-shadow-lg">Crocz <span
            class="inline-block animate-bounce">🔐</span></h1>
    <div class="bg-slate-800/80 backdrop-blur-lg shadow-2xl rounded-2xl p-8 w-full max-w-md flex flex-col items-center">
        <form id="uploadForm" class="w-full flex flex-col gap-6">
            <div>
                <label class="block text-lg font-semibold mb-2 text-emerald-300">Choose a file</label>
                <input title="Choose a file" type="file" name="file" required
                    class="file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-500 file:text-slate-900 hover:file:bg-emerald-400 transition-all duration-200 bg-slate-700/60 text-slate-100 rounded-lg w-full" />
            </div>
            <div>
                <label class="block text-lg font-semibold mb-2 text-emerald-300">Enter a passphrase</label>
                <input type="text" name="passphrase" placeholder="e.g. mySecret123" required
                    class="bg-slate-700/60 text-slate-100 rounded-lg w-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-400" />
            </div>
            <button type="submit"
                class="bg-gradient-to-r from-emerald-400 to-emerald-600 text-slate-900 font-bold py-3 rounded-xl shadow-lg hover:scale-105 hover:from-emerald-500 hover:to-emerald-700 transition-all duration-200">Upload
                & Encrypt</button>
        </form>
        <div class="result mt-6 text-center text-base font-medium" id="result"></div>
    </div>
    <script>
        const form = document.getElementById("uploadForm");
        const resultDiv = document.getElementById("result");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const formData = new FormData(form);

            try {
                const res = await fetch("/upload", {
                    method: "POST",
                    body: formData
                });

                if (res.ok) {
                    const data = await res.json();
                    resultDiv.innerHTML = `
                        <div class='bg-emerald-900/80 rounded-xl p-4 shadow-lg border border-emerald-500'>
                            <span class='text-emerald-400 text-xl font-bold'>✅ Upload Successful!</span><br>
                            <span class='text-slate-200'>Share this code with the recipient:</span><br>
                            <strong class='text-2xl text-emerald-300 tracking-widest'>${data.code}</strong><br><br>
                            <a href="/frontend/download.html?code=${data.code}" target="_blank" class="inline-block mt-2 px-4 py-2 bg-emerald-500 text-slate-900 font-semibold rounded-lg shadow hover:bg-emerald-400 transition">Download Page</a>
                        </div>
                    `;
                    form.reset();
                } else {
                    const errorText = await res.text();
                    resultDiv.innerHTML = `<span class='text-red-400 font-bold'>❌ ${errorText}</span>`;
                }
            } catch (error) {
                console.error("Upload failed:", error);
                resultDiv.innerHTML = `<span class='text-red-400 font-bold'>❌ Upload failed: ${error.message}</span>`;
            }
        });
    </script>
</body>

</html>
