<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Crocz - Upload</title>
    <style>
        body {
            font-family: sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 20px rgba(0, 255, 150, 0.2);
        }

        input,
        button {
            width: 100%;
            margin-top: 1rem;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
        }

        button {
            background: #22c55e;
            color: black;
            cursor: pointer;
        }

        .result {
            margin-top: 1rem;
            font-size: 1rem;
            word-break: break-word;
        }
    </style>
</head>

<body>
    <h1>Crocz 🔐</h1>
    <div class="card">
        <form id="uploadForm">
            <label>Choose a file</label>
            <input title="Choose a file" type="file" name="file" required />

            <label>Enter a passphrase</label>
            <input type="text" name="passphrase" placeholder="e.g. mySecret123" required />

            <button type="submit">Upload & Encrypt</button>
        </form>

        <div class="result" id="result"></div>
    </div>

    <script>
        const form = document.getElementById("uploadForm");
        const resultDiv = document.getElementById("result");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const formData = new FormData(form);

            try {
                const res = await fetch("/upload", {
                    method: "POST",
                    body: formData
                });

                if (res.ok) {
                    const data = await res.json();
                    resultDiv.innerHTML = `
              ✅ Upload Successful!<br>
              Share this code with the recipient:<br>
              <strong>${data.code}</strong><br><br>
              Download link: <a href="/frontend/download.html?code=${data.code}" target="_blank">Download Page</a>
            `;
                    form.reset();
                } else {
                    const errorText = await res.text();
                    resultDiv.innerHTML = `❌ ${errorText}`;
                }
            } catch (error) {
                console.error("Upload failed:", error);
                resultDiv.innerHTML = `❌ Upload failed: ${error.message}`;
            }
        });
    </script>
</body>

</html>
